version: 2

updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
    groups:
      third-party-images:
        patterns:
          - "localstack/*"
      exclude-local:
        exclude-patterns:
          - "fcp-sfd-performance-test-suite*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
    groups:
      core-actions:
        patterns:
          - "actions/*"
      defra-actions:
        patterns:
          - "DEFRA/*"